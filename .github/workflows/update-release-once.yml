name: Replace 1.0.0 APK with audited upgrade-compatible build
on:
  push:
    branches: [arena/d95398fc-net-optimizer-by-doxaiz]
permissions:
  contents: write
  actions: read
jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Retrieve and verify audited candidate and existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44345123395" --jq '[.head_sha,.conclusion] | @tsv')
          [[ "$state" == $'57d015c'*$'\tsuccess' ]] || { echo '::error::Android emulator audit did not succeed for expected commit'; exit 1; }
          mkdir -p "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/backup"
          gh run download 44345123395 --repo "$GITHUB_REPOSITORY" --name android-audit-candidate --dir "$RUNNER_TEMP/candidate"
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --pattern app-release.apk --dir "$RUNNER_TEMP/backup"
          echo '44c6b8d78a126c203d3b497ba8193defb302fc9c62bdff8b76818bdbd81c8fec  '"$RUNNER_TEMP/backup/app-release.apk" | sha256sum -c -
          candidate="$RUNNER_TEMP/candidate/app-release.apk"
          tools=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1 | xargs dirname)
          "$tools/apksigner" verify --verbose --print-certs "$candidate" > "$RUNNER_TEMP/new-cert.txt"
          "$tools/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/backup/app-release.apk" > "$RUNNER_TEMP/old-cert.txt"
          grep -i -m1 'certificate.*sha-256.*digest' "$RUNNER_TEMP/new-cert.txt" > "$RUNNER_TEMP/new-digest.txt"
          grep -i -m1 'certificate.*sha-256.*digest' "$RUNNER_TEMP/old-cert.txt" > "$RUNNER_TEMP/old-digest.txt"
          cmp "$RUNNER_TEMP/new-digest.txt" "$RUNNER_TEMP/old-digest.txt"
          badging=$("$tools/aapt" dump badging "$candidate" | sed -n '1p')
          [[ "$badging" == *"name='com.doxaiz.netoptimizer'"* && "$badging" == *"versionCode='12'"* && "$badging" == *"versionName='1.0.0'"* ]]
          unzip -t "$candidate" > /dev/null
          sha256sum "$candidate"
      - name: Replace APK and keep release source reference accurate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          oldsha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0" --jq .object.sha)
          test "$oldsha" = 24c005d75f7db3e988d04a0c58e78b7dc3c59b18
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/old-notes.txt"
          updated=0
          rollback() {
            status=$?
            if (( status != 0 && updated == 1 )); then
              echo '::warning::Replacement failed; attempting to restore original release asset and tag.'
              gh release upload v1.0.0 "$RUNNER_TEMP/backup/app-release.apk" --repo "$GITHUB_REPOSITORY" --clobber || true
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.0.0" -f sha="$oldsha" -F force=true > /dev/null || true
              gh release edit v1.0.0 --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/old-notes.txt" || true
            fi
            exit "$status"
          }
          trap rollback EXIT
          updated=1
          gh release upload v1.0.0 "$RUNNER_TEMP/candidate/app-release.apk" --repo "$GITHUB_REPOSITORY" --clobber
          expected="sha256:$(sha256sum "$RUNNER_TEMP/candidate/app-release.apk" | cut -d' ' -f1)"
          actual=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" --jq '.assets[] | select(.name == "app-release.apk") | .digest')
          test "$actual" = "$expected"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.0.0" -f sha=296dc9ccb4d6c252d05b5bab6a6bf1441bbbc07e -F force=true > /dev/null
          cat > "$RUNNER_TEMP/notes.txt" <<'NOTES'
          Версия 1.0.0: исправлена установка поверх прежних сборок. Видимое имя версии осталось 1.0.0, внутренний versionCode повышен до 12, чтобы Android мог обновить старую 1.1.1 (11) и прежний APK 1.0.0 (1) без удаления. Перед обновлением рекомендуется экспортировать нужную локальную историю.

          Файл APK заменён после проверки установки, обновления с обоих прежних APK, первого запуска и пяти вкладок на эмуляторах Android 12 и 14. Unit-тесты, Android lint и проверка подписи прошли. Проверка на Infinix/XOS и реальной мобильной сети ещё необходима; результат установки зависит от устройства и профиля Android.

          APK подписан прежним ключом по выбору владельца. Ключ и пароль ранее были опубликованы в истории репозитория и считаются скомпрометированными. Фоновые режимы и VPN-фильтрация пока не работают; замеры обращаются к сторонним серверам и расходуют мобильный трафик.

          Исходный код сборки: commit 296dc9ccb4d6c252d05b5bab6a6bf1441bbbc07e. Проверки: https://github.com/Doxaiz/net-optimizer-by_doxaiz/actions/runs/44345123395
          NOTES
          gh release edit v1.0.0 --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.txt"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0" --jq .object.sha)" = 296dc9ccb4d6c252d05b5bab6a6bf1441bbbc07e
          updated=0
          echo "::notice title=Release replaced::$expected"
