name: Diagnose release verification once
on:
  push:
    branches: [arena/d95398fc-net-optimizer-by-doxaiz]
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Report non-secret verification failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/134863332496/logs" > "$RUNNER_TEMP/prior-job.log"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          data = Path(os.environ['RUNNER_TEMP'], 'prior-job.log').read_text(errors='replace').splitlines()
          inside = False
          past_commands = False
          for line in data:
              if 'apk=app/build/outputs/apk/release/app-release.apk' in line:
                  inside = True
                  continue
              if not inside:
                  continue
              if '##[endgroup]' in line:
                  past_commands = True
                  continue
              if past_commands:
                  if '##[group]' in line:
                      break
                  text = re.sub(r'^\S+\s+', '', line).strip()
                  if text and any(w in text.lower() for w in ('package:', 'error', 'failed', 'not found', 'no such', 'different', 'http', 'fatal')):
                      text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')[:600]
                      print('::notice title=Verification output::' + text)
          PY
