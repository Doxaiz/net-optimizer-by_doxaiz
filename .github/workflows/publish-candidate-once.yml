name: Publish verified 1.0.3 (temporary)
on:
  push:
    branches: [arena/1726de30-net-optimizer-by-doxaiz]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify checks and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 44427584380 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view 44427584380 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = 938d9e4d553a065beba4abc7f7b4b18680777b89
          git diff --quiet 87ae5daa5804c67fcfec95b7f22a15c783e3c804 938d9e4d553a065beba4abc7f7b4b18680777b89 -- app build.gradle.kts settings.gradle.kts gradle gradle.properties
          if gh release view v1.0.3 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo '::error::Release v1.0.3 already exists; refusing to replace it.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: release-1.0.3-candidate
          path: candidate
          run-id: 44427584380
          github-token: ${{ github.token }}
      - name: Publish checked APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=candidate/app-release.apk
          test -s "$apk"
          hash=$(sha256sum "$apk" | cut -d ' ' -f1)
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Что нового

          - Кнопка «Оптимизировать сеть» после подтверждения измеряет задержку, включает системную экономию трафика через Shizuku и повторяет замер.
          - Без Shizuku доступны настройки Android. При отсутствии мобильной сети или неудаче первого замера настройка не меняется.
          - Экономия может ограничивать фоновые загрузки на лимитных сетях, включая лимитный Wi‑Fi, и задерживать уведомления. Она действует на всём устройстве до отключения. Улучшение не гарантировано.

          ## Установка

          Android 12+, versionCode 16. Подпись совпадает с 1.0.2. Обновление и управление экономией через Shizuku 13.6.0 проверены на эмуляторах Android 12 и 14. Сохраните важную историю перед установкой. Реальный телефон и улучшение мобильной сети ещё не проверялись.

          По решению владельца используется прежний, скомпрометированный ключ подписи.

          SHA-256: \`$hash\`
          EOF
          gh release create v1.0.3 "$apk" --repo "$GITHUB_REPOSITORY" --target 87ae5daa5804c67fcfec95b7f22a15c783e3c804 --title 'Net Optimizer by Doxaiz 1.0.3' --notes-file "$RUNNER_TEMP/notes.md" --latest
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.3" --jq '.assets[] | select(.name == "app-release.apk") | .digest')
          test "$digest" = "sha256:$hash"
          echo "Published SHA-256: $hash"
