name: Publish verified 1.0.8 (temporary)
on:
  push:
    branches: [arena/18f61145-net-optimizer-by-doxaiz]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify checks and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 44557566892 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view 44557566892 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = 4f49a89b93accc437b8290c68845d11454d395c3
          git diff --quiet aaf0485cea1e9a8d8542293494a42286370a9901 4f49a89b93accc437b8290c68845d11454d395c3 -- app build.gradle.kts settings.gradle.kts gradle gradle.properties
          if gh release view v1.0.8 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo '::error::Release v1.0.8 already exists; refusing to replace it.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: release-1.0.8-candidate
          path: candidate
          run-id: 44557566892
          github-token: ${{ github.token }}
      - name: Publish checked APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=candidate/app-release.apk
          test -s "$apk"
          hash=$(sha256sum "$apk" | cut -d ' ' -f1)
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Что нового

          - Историю мобильного расхода можно сортировать по общему расходу или по данным, не отнесённым Android к foreground («условно фон»).
          - Это приблизительная историческая оценка, не текущая активность. Если Android не предоставляет состояние, оно отмечено как недоступное.
          - Фоновые данные выбранного приложения пользователь настраивает вручную в Android, без Shizuku. Ограничение может задерживать уведомления и сохраняется до отмены.
          - Изменения не гарантируют улучшения скорости или задержки.

          ## Установка

          Android 12+, versionCode 21. Подпись совпадает с 1.0.7; обновление и ручные действия проверены на эмуляторах Android 12 и 14. Резервируйте важную историю перед установкой. Физический телефон, оператор и улучшение сети не проверены.

          По решению владельца используется прежний, скомпрометированный ключ подписи.

          SHA-256: \`$hash\`
          EOF
          gh release create v1.0.8 "$apk" --repo "$GITHUB_REPOSITORY" --target aaf0485cea1e9a8d8542293494a42286370a9901 --title 'Net Optimizer by Doxaiz 1.0.8' --notes-file "$RUNNER_TEMP/notes.md" --latest
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.8" --jq '.assets[] | select(.name == "app-release.apk") | .digest')
          test "$digest" = "sha256:$hash"
          echo "Published SHA-256: $hash"
