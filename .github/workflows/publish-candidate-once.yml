name: Publish verified 1.0.6 (temporary)
on:
  push:
    branches: [arena/764fcedb-net-optimizer-by-doxaiz]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify checks and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 44537167718 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view 44537167718 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = 038d732c04f7a187bd19411c8337b826951ef7d0
          git diff --quiet 6441d76bef892e9a1c28aa611992d36abf798f43 038d732c04f7a187bd19411c8337b826951ef7d0 -- app build.gradle.kts settings.gradle.kts gradle gradle.properties
          if gh release view v1.0.6 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo '::error::Release v1.0.6 already exists; refusing to replace it.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: release-1.0.6-candidate
          path: candidate
          run-id: 44537167718
          github-token: ${{ github.token }}
      - name: Publish checked APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=candidate/app-release.apk
          test -s "$apk"
          hash=$(sha256sum "$apk" | cut -d ' ' -f1)
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Что нового

          - Без Shizuku можно открыть системные настройки фоновых данных выбранного приложения и вручную ограничить его фоновые загрузки на лимитных сетях.
          - Это не останавливает приложение целиком. Можно отдельно открыть карточку Android для ручной остановки. Уведомления и синхронизация могут задерживаться.
          - Ограничение остаётся до ручного снятия. На разных телефонах экран и название переключателя могут отличаться; результат на скорость не гарантирован.

          ## Установка

          Android 12+, versionCode 19. Подпись совпадает с 1.0.5. Обновление и ручные действия без Shizuku, а также доступ через Shizuku 13.6.0 проверены на эмуляторах Android 12 и 14. Сохраните важную историю перед установкой. Реальный телефон и улучшение мобильной сети ещё не проверялись.

          По решению владельца используется прежний, скомпрометированный ключ подписи.

          SHA-256: \`$hash\`
          EOF
          gh release create v1.0.6 "$apk" --repo "$GITHUB_REPOSITORY" --target 6441d76bef892e9a1c28aa611992d36abf798f43 --title 'Net Optimizer by Doxaiz 1.0.6' --notes-file "$RUNNER_TEMP/notes.md" --latest
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.6" --jq '.assets[] | select(.name == "app-release.apk") | .digest')
          test "$digest" = "sha256:$hash"
          echo "Published SHA-256: $hash"
