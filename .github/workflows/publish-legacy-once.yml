name: Publish selected legacy-signed 1.0.0 once

on:
  push:
    branches:
      - arena/d95398fc-net-optimizer-by-doxaiz

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Check exact release source and run tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "24c005d75f7db3e988d04a0c58e78b7dc3c59b18"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/publish-legacy-once.yml"
          gradle --no-daemon --console plain testReleaseUnitTest lintRelease
      - name: Build with the existing legacy signing identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/legacy-signing.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          git show cdee2c69a77361c141d2da1e902f2ed171a83fa8:doxaiz-release.jks > "$ANDROID_KEYSTORE_PATH"
          python3 - <<'PY'
          import os, re, subprocess
          source = subprocess.check_output(['git', 'show', 'cdee2c69a77361c141d2da1e902f2ed171a83fa8:app/build.gradle.kts'], text=True)
          for key, env in [('storePassword', 'ANDROID_KEYSTORE_PASSWORD'), ('keyAlias', 'ANDROID_KEY_ALIAS'), ('keyPassword', 'ANDROID_KEY_PASSWORD')]:
              match = re.search(r'^\s*' + key + r'\s*=\s*"([^"\r\n]+)"\s*$', source, re.MULTILINE)
              if not match:
                  raise SystemExit('Legacy signing configuration could not be read')
              value = match.group(1)
              print('::add-mask::' + value, flush=True)
              os.environ[env] = value
          os.execvp('gradle', ['gradle', '--no-daemon', '--console', 'plain', 'assembleRelease'])
          PY
      - name: Verify package, version and signing identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          tools=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1 | xargs dirname)
          test -x "$tools/apksigner"
          test -x "$tools/aapt"
          "$tools/aapt" dump badging "$apk" | grep -F "package: name='com.doxaiz.netoptimizer' versionCode='1' versionName='1.0.0'"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/new-cert.txt"
          mkdir -p "$RUNNER_TEMP/previous-release"
          gh release download v1.1.1 --repo "$GITHUB_REPOSITORY" --pattern app-release.apk --dir "$RUNNER_TEMP/previous-release"
          "$tools/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/previous-release/app-release.apk" > "$RUNNER_TEMP/old-cert.txt"
          grep '^Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/new-cert.txt" > "$RUNNER_TEMP/new-digest.txt"
          grep '^Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/old-cert.txt" > "$RUNNER_TEMP/old-digest.txt"
          cmp "$RUNNER_TEMP/new-digest.txt" "$RUNNER_TEMP/old-digest.txt"
          sha256sum "$apk"
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.0.0 app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target 24c005d75f7db3e988d04a0c58e78b7dc3c59b18 \
            --title 'Net Optimizer by Doxaiz 1.0.0' \
            --notes 'Первый релиз с новой нумерацией. Исходный код: commit 24c005d75f7db3e988d04a0c58e78b7dc3c59b18. Для установки вместо версии 1.1.1 необходимо сначала сохранить нужную локальную историю и удалить старое приложение: Android не устанавливает APK с меньшим versionCode поверх более нового. Подпись совпадает с прежним релизом; прежний ключ и пароль были опубликованы в истории репозитория и считаются скомпрометированными. Проверка на конкретном телефоне не проводилась. Измерения используют сторонние узлы и мобильный трафик; фоновые режимы и VPN-фильтрация пока недоступны.'
