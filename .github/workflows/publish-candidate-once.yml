name: Publish verified 1.0.10 (temporary)
on:
  push:
    branches: [arena/6b7e1ce7-net-optimizer-by-doxaiz]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify checks and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 44691607516 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view 44691607516 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = 46e5c23285a8ef01ec43287f9df0eab4faa47821
          git diff --quiet 7accbcb22bfee1fc82eef20381962d2d39292b32 46e5c23285a8ef01ec43287f9df0eab4faa47821 -- app build.gradle.kts settings.gradle.kts gradle gradle.properties
          if gh release view v1.0.10 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo '::error::Release v1.0.10 already exists; refusing to replace it.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: release-1.0.10-candidate
          path: candidate
          run-id: 44691607516
          github-token: ${{ github.token }}
      - name: Publish checked APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=candidate/app-release.apk
          test -s "$apk"
          hash=$(sha256sum "$apk" | cut -d ' ' -f1)
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Что нового

          - Без Shizuku и доступа к истории можно измерить общую передачу данных на мобильных интерфейсах за 10 секунд и повторить замер после ручных изменений.
          - Замер считывает системные счётчики и не отправляет сетевые запросы. При повторном измерении показывается и предыдущий результат.
          - Это не скорость тарифа и не данные конкретного приложения. Раздача может учитываться иначе; разница не доказывает причину и не гарантирует улучшение сети.
          - Системные ограничения пользователь меняет вручную; они могут задерживать уведомления и остаются до отмены.

          ## Установка

          Android 12+, versionCode 23. Подпись совпадает с 1.0.9. Обновление, ручные действия и замер проверены на эмуляторах Android 12 и 14; доступность виртуальных мобильных счётчиков различается. Сохраните важную историю перед установкой. Реальный телефон и улучшение сети не проверены.

          По решению владельца используется прежний, скомпрометированный ключ подписи.

          SHA-256: \`$hash\`
          EOF
          gh release create v1.0.10 "$apk" --repo "$GITHUB_REPOSITORY" --target 7accbcb22bfee1fc82eef20381962d2d39292b32 --title 'Net Optimizer by Doxaiz 1.0.10' --notes-file "$RUNNER_TEMP/notes.md" --latest
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.10" --jq '.assets[] | select(.name == "app-release.apk") | .digest')
          test "$digest" = "sha256:$hash"
          echo "Published SHA-256: $hash"
