name: One-off Craft Anything APK inspection
on:
  push:
    branches:
      - arena/d95398fc-net-optimizer-by-doxaiz
    paths:
      - .github/workflows/craft-audit-once.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build disposable inspection APK
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/inspection-key.p12"
          export ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          export ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          export ANDROID_KEY_ALIAS="inspection-only"
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          keytool -genkeypair -noprompt -keystore "$ANDROID_KEYSTORE_PATH" -storetype PKCS12 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'CN=Disposable inspection only'
          gradle --no-daemon --console plain assembleRelease
      - name: Download and check the public Craft Anything release
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base=https://github.com/storytold/craft-anything/releases/download/v0.6.1
          curl -fLsS --retry 2 "$base/SHA256SUMS.txt" -o SHA256SUMS.txt
          curl -fLsS --retry 2 "$base/craft-anything-0.6.1-linux-x86_64.tar.gz" -o craft.tar.gz
          expected=$(awk '$2 == "craft-anything-0.6.1-linux-x86_64.tar.gz" {print $1}' SHA256SUMS.txt)
          test -n "$expected"
          printf '%s  craft.tar.gz\n' "$expected" | sha256sum -c -
          mkdir -p craft
          tar -xzf craft.tar.gz -C craft --no-same-owner --wildcards '*/bin/craft-anything-cli'
      - name: Inspect our APK (no AI, no third-party APKs)
        run: |
          set -euo pipefail
          cli=$(find "$RUNNER_TEMP/craft" -type f -name craft-anything-cli -print -quit)
          test -n "$cli"
          mkdir -p "$RUNNER_TEMP/craft-home" reports
          apk="$GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk"
          env -i HOME="$RUNNER_TEMP/craft-home" PATH=/usr/bin:/bin "$cli" --deep android-package-show --path "$apk" --include-manifest-xml false > reports/craft-package.json
          env -i HOME="$RUNNER_TEMP/craft-home" PATH=/usr/bin:/bin "$cli" --deep android-components-list --path "$apk" > reports/craft-components.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('package', 'components'):
              data = json.loads(Path(f'reports/craft-{name}.json').read_text())
              summary = data.get('summary', '')
              details = json.dumps(data.get('result', {}), ensure_ascii=False)[:2500]
              text = (name + ': ' + summary + '\n' + details).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::notice::' + text)
          PY
      - name: Upload inspection output (not APK or signing key)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craft-android-inspection
          path: reports/*.json
          if-no-files-found: warn
