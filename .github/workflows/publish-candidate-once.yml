name: Publish verified 1.0.9 (temporary)
on:
  push:
    branches: [arena/0ab99ff5-net-optimizer-by-doxaiz]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify checks and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 44593992364 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view 44593992364 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = d05640a9a42e45c0258a14a7fbf0ec7e6cb8c080
          git diff --quiet 68df77285c3762b65a6231e75f1895163864e27d d05640a9a42e45c0258a14a7fbf0ec7e6cb8c080 -- app build.gradle.kts settings.gradle.kts gradle gradle.properties
          if gh release view v1.0.9 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo '::error::Release v1.0.9 already exists; refusing to replace it.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: release-1.0.9-candidate
          path: candidate
          run-id: 44593992364
          github-token: ${{ github.token }}
      - name: Publish checked APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=candidate/app-release.apk
          test -s "$apk"
          hash=$(sha256sum "$apk" | cut -d ' ' -f1)
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Что нового

          - Выбранные приложения можно закрепить для быстрого возврата к настройкам фоновых данных — без Shizuku и доступа к истории использования.
          - Закрепление сохраняется на телефоне, не меняет и не показывает состояние настроек Android. В настройках можно вручную вернуть фоновые данные обратно.
          - Ограничение фоновых данных может задерживать уведомления и не гарантирует улучшение сети.

          ## Установка

          Android 12+, versionCode 22. Подпись совпадает с 1.0.8. Обновление, сохранение закрепления и ручные действия проверены на эмуляторах Android 12 и 14. Сохраните важную историю перед установкой. Реальный телефон и прирост скорости не проверены.

          По решению владельца используется прежний, скомпрометированный ключ подписи.

          SHA-256: \`$hash\`
          EOF
          gh release create v1.0.9 "$apk" --repo "$GITHUB_REPOSITORY" --target 68df77285c3762b65a6231e75f1895163864e27d --title 'Net Optimizer by Doxaiz 1.0.9' --notes-file "$RUNNER_TEMP/notes.md" --latest
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.9" --jq '.assets[] | select(.name == "app-release.apk") | .digest')
          test "$digest" = "sha256:$hash"
          echo "Published SHA-256: $hash"
