name: UI screenshots

on:
  workflow_dispatch:
  push:
    branches: [arena/47e3024f-net-optimizer-by-doxaiz]
    paths:
      - 'app/**'
      - 'scripts/capture-ui-screenshots.py'
      - '.github/workflows/ui-screenshots.yml'
      - '.github/actions/**' 

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: ./.github/actions/setup-rust-android
      - name: Build development APK
        run: gradle --no-daemon --console plain assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture screens on a disposable emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            adb shell wm size 1080x2400
            adb shell wm density 420
            AUDIT_DISPOSABLE_EMULATOR=yes SHOT_DIR=ui-screenshots python3 scripts/capture-ui-screenshots.py app/build/outputs/apk/debug/app-debug.apk
      - name: Shrink screenshots for review
        if: always()
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/shrink-screenshots.py ui-screenshots
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-screenshots
          if-no-files-found: warn
      - name: Publish screenshots for review
        if: always()
        run: |
          if [ -z "$(ls -A ui-screenshots 2>/dev/null)" ]; then echo "nothing to publish"; exit 0; fi
          git config user.name "screenshot bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f ui-screenshots || echo "nothing added"
          git diff --cached --quiet || git commit -q -m "Publish UI screenshots for review [skip ci]"
          git pull --rebase -q -X ours origin ${GITHUB_REF_NAME} || echo "rebase skipped"
          git push origin HEAD:${GITHUB_REF_NAME} || echo "push failed"
