name: Android lint

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run Android lint
        run: |
          set -o pipefail
          if ! gradle --no-daemon --console plain lintRelease > lint-output.log 2>&1; then
            tail -100 lint-output.log
            python3 -c "from pathlib import Path; p=Path('app/build/reports/lint-results-release.txt'); s=('\n'.join(line for line in p.read_text(errors='replace').splitlines() if ': Error:' in line or ' errors, ' in line)[:3300] if p.exists() else Path('lint-output.log').read_text(errors='replace')[-3300:]); print('::error::' + s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
            exit 1
          fi
          cat lint-output.log
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-lint-report
          path: |
            app/build/reports/lint-results-release.*
            lint-output.log
          if-no-files-found: warn
