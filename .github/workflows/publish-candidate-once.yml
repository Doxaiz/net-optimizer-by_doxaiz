name: Publish verified 1.0.4 (temporary)
on:
  push:
    branches: [arena/3cc3250d-net-optimizer-by-doxaiz]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify checks and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 44449370139 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view 44449370139 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = f61c023552bdb5f0a61a7130c84a4c9bfd534a92
          git diff --quiet ff4d9b86f34690e8989e2db4a7b34ff19c686cd4 f61c023552bdb5f0a61a7130c84a4c9bfd534a92 -- app build.gradle.kts settings.gradle.kts gradle gradle.properties
          if gh release view v1.0.4 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo '::error::Release v1.0.4 already exists; refusing to replace it.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: release-1.0.4-candidate
          path: candidate
          run-id: 44449370139
          github-token: ${{ github.token }}
      - name: Publish checked APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=candidate/app-release.apk
          test -s "$apk"
          hash=$(sha256sum "$apk" | cut -d ' ' -f1)
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Что нового

          - Без Shizuku кнопка проводит замер и открывает системные настройки: включите экономию трафика в Android и вернитесь для повторного замера.
          - Android не разрешает обычному приложению включать эту настройку самостоятельно. Её состояние нужно проверять в настройках устройства.
          - Экономия может ограничивать фоновые загрузки на лимитных сетях, включая лимитный Wi‑Fi, и задерживать уведомления. Она действует на всём устройстве до отключения. Улучшение не гарантировано.

          ## Установка

          Android 12+, versionCode 17. Подпись совпадает с 1.0.3. Обновление, ручной сценарий без Shizuku и управление через Shizuku 13.6.0 проверены на эмуляторах Android 12 и 14. Сохраните важную историю перед установкой. Реальный телефон и улучшение мобильной сети ещё не проверялись.

          По решению владельца используется прежний, скомпрометированный ключ подписи.

          SHA-256: \`$hash\`
          EOF
          gh release create v1.0.4 "$apk" --repo "$GITHUB_REPOSITORY" --target ff4d9b86f34690e8989e2db4a7b34ff19c686cd4 --title 'Net Optimizer by Doxaiz 1.0.4' --notes-file "$RUNNER_TEMP/notes.md" --latest
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.4" --jq '.assets[] | select(.name == "app-release.apk") | .digest')
          test "$digest" = "sha256:$hash"
          echo "Published SHA-256: $hash"
