name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build release APK
        run: |
          set -o pipefail
          if ! gradle --no-daemon --console plain assembleRelease > build-output.log 2>&1; then
            tail -100 build-output.log
            python3 -c "from pathlib import Path; s=Path('build-output.log').read_text(errors='replace')[-12000:]; print('::error::' + s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
            exit 1
          fi
          cat build-output.log
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NetOptimizer-by-Doxaiz-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
