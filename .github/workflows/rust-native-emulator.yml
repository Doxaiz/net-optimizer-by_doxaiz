name: Rust JNI verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 31
            target: google_apis
            page_size: 4096
          - api: 34
            target: google_apis
            page_size: 4096
          # API 35 image with genuinely 16 KiB pages, not Android 16's compatibility mode.
          - api: 35
            target: google_apis_ps16k
            page_size: 16384
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: ./.github/actions/setup-rust-android
      - name: Test Rust calculations on the host
        run: cargo test --locked --manifest-path native/netoptimizer-core/Cargo.toml
      - name: Build APK and Android instrumentation tests
        run: |
          bash scripts/run-ci-gradle.sh assembleDebug assembleDebugAndroidTest
          python3 scripts/check-native-apk.py app/build/outputs/apk/debug/app-debug.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual Rust JNI against Kotlin reference
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          script: bash scripts/run-rust-instrumentation.sh com.doxaiz.netoptimizer.core.net.NativeMeasurementsInstrumentedTest ${{ matrix.page_size }} && bash scripts/run-rust-instrumentation.sh com.doxaiz.netoptimizer.core.traffic.TrafficRankingInstrumentedTest ${{ matrix.page_size }}

  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build explicitly without the native library
        run: |
          bash scripts/run-ci-gradle.sh -PnativeRust=false testReleaseUnitTest assembleDebug assembleDebugAndroidTest
          python3 -c 'import zipfile; z=zipfile.ZipFile("app/build/outputs/apk/debug/app-debug.apk"); assert not any(n.endswith("/libnetoptimizer_core.so") for n in z.namelist())'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Kotlin fallback on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: bash scripts/run-rust-instrumentation.sh com.doxaiz.netoptimizer.core.net.NativeFallbackInstrumentedTest

  arm64-core:
    # Native Linux ARM64 exercises Rust arithmetic on ARM; this is not an Android device test.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: 1.85.1
      - name: Run Rust unit tests on ARM64 Linux
        run: cargo test --locked --manifest-path native/netoptimizer-core/Cargo.toml
