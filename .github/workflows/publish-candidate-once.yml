name: Publish verified 1.0.12 (temporary)
on:
  push:
    branches: [arena/79fddbf5-net-optimizer-by-doxaiz]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify checks and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 44745270549 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view 44745270549 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = b4d85372939c1171023fb9fc4d3eb1b644d16738
          git diff --quiet 2609f01fc06cb149a80e2377652f73533cd299e2 b4d85372939c1171023fb9fc4d3eb1b644d16738 -- app build.gradle.kts settings.gradle.kts gradle gradle.properties
          git diff --quiet 2609f01fc06cb149a80e2377652f73533cd299e2 HEAD -- app build.gradle.kts settings.gradle.kts gradle gradle.properties
          if gh release view v1.0.12 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo '::error::Release v1.0.12 already exists; refusing to replace it.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: release-1.0.12-candidate
          path: candidate
          run-id: 44745270549
          github-token: ${{ github.token }}
      - name: Publish checked APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=candidate/app-release.apk
          test -s "$apk"
          hash=$(sha256sum "$apk" | cut -d ' ' -f1)
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Что нового

          - Выбор домена, IPv4 или IPv6 и TCP-порта для необязательного сравнения задержки до и после изменений. Адрес хранится локально; оба замера направляются к одному разрешённому IP в одной мобильной сети.
          - Сравнение доступно без Shizuku и может быть отключено в автоматическом сценарии. Разница замеров не доказывает ускорение или его причину и не является пингом игрового сервера.
          - Результат измерения общей мобильной нагрузки прокручивается в видимую область, когда пользователь остаётся у карточки замера.

          ## Установка и проверка

          Android 12+, versionCode 25. Подпись совпадает с 1.0.11. Обновление, основные экраны, настройки и необязательное сравнение проверены на одноразовых эмуляторах Android 12 и 14. Сохраните важную историю перед обновлением. Физический телефон, реальный модем, IPv6-соединение и ускорение сети не проверены.

          По решению владельца используется прежний, скомпрометированный ключ подписи.

          SHA-256: \`$hash\`
          EOF
          gh release create v1.0.12 "$apk" --repo "$GITHUB_REPOSITORY" --target 2609f01fc06cb149a80e2377652f73533cd299e2 --title 'Net Optimizer by Doxaiz 1.0.12' --notes-file "$RUNNER_TEMP/notes.md" --latest
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.12" --jq '.assets[] | select(.name == "app-release.apk") | .digest')
          test "$digest" = "sha256:$hash"
          echo "Published SHA-256: $hash"
