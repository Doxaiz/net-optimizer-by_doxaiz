name: Publish verified 1.0.11 (temporary)
on:
  push:
    branches: [arena/bcc50131-net-optimizer-by-doxaiz]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify checks and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 44699507121 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view 44699507121 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = 5ad457866d227fc554876e5ae5e7eb066bd4afd6
          git diff --quiet 43cda310f2b35c1c0b625cd1f3499c40b2e5d4d1 5ad457866d227fc554876e5ae5e7eb066bd4afd6 -- app build.gradle.kts settings.gradle.kts gradle gradle.properties
          if gh release view v1.0.11 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo '::error::Release v1.0.11 already exists; refusing to replace it.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: release-1.0.11-candidate
          path: candidate
          run-id: 44699507121
          github-token: ${{ github.token }}
      - name: Publish checked APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=candidate/app-release.apk
          test -s "$apk"
          hash=$(sha256sum "$apk" | cut -d ' ' -f1)
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Что нового

          - Исправлена обработка смены мобильной сети во время TCP-проверки: прерванный замер не выдаётся за успешный, даже если прежняя сеть вернулась.
          - На небольших экранах результат проверки автоматически прокручивается в видимую область.
          - Удалены неиспользуемые разрешения и недоступные службы оверлея и VPN; основные ручные действия по-прежнему доступны без Shizuku.

          ## Установка и проверка

          Android 12+, versionCode 24. Подпись совпадает с 1.0.10. Обновление, основные экраны и ручные настройки проверены на эмуляторах Android 12 и 14, состав разрешений — в самом APK. Сохраните важную историю перед обновлением. Проверка на физическом телефоне и ускорение сети не подтверждены.

          По решению владельца используется прежний, скомпрометированный ключ подписи.

          SHA-256: \`$hash\`
          EOF
          gh release create v1.0.11 "$apk" --repo "$GITHUB_REPOSITORY" --target 43cda310f2b35c1c0b625cd1f3499c40b2e5d4d1 --title 'Net Optimizer by Doxaiz 1.0.11' --notes-file "$RUNNER_TEMP/notes.md" --latest
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.11" --jq '.assets[] | select(.name == "app-release.apk") | .digest')
          test "$digest" = "sha256:$hash"
          echo "Published SHA-256: $hash"
