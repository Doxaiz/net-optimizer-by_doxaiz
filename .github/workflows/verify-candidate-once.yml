name: Verify 1.0.11 release candidate (temporary)

on:
  push:
    branches: [arena/bcc50131-net-optimizer-by-doxaiz]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test and lint
        run: |
          git diff --quiet 351ef5dfce413cacf2784c758ee995addf922e8e HEAD -- app build.gradle.kts settings.gradle.kts gradle gradle.properties
          gradle --no-daemon --console plain testReleaseUnitTest lintRelease
      - name: Build with previously selected signing identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/candidate-signing.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          git show cdee2c69a77361c141d2da1e902f2ed171a83fa8:doxaiz-release.jks > "$ANDROID_KEYSTORE_PATH"
          python3 - <<'PY'
          import os, re, subprocess
          source = subprocess.check_output(['git', 'show', 'cdee2c69a77361c141d2da1e902f2ed171a83fa8:app/build.gradle.kts'], text=True)
          for key, env in [('storePassword', 'ANDROID_KEYSTORE_PASSWORD'), ('keyAlias', 'ANDROID_KEY_ALIAS'), ('keyPassword', 'ANDROID_KEY_PASSWORD')]:
              match = re.search(r'^\s*' + key + r'\s*=\s*"([^"\r\n]+)"\s*$', source, re.MULTILINE)
              if not match:
                  raise SystemExit('Existing signing configuration unavailable')
              value = match.group(1)
              print('::add-mask::' + value, flush=True)
              os.environ[env] = value
          os.execvp('gradle', ['gradle', '--no-daemon', '--console', 'plain', 'assembleRelease'])
          PY
      - name: Verify APK and compare signature with published 1.0.10
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download v1.0.10 --repo "$GITHUB_REPOSITORY" --pattern app-release.apk --dir published
          echo '90ea233d379164a406d100609103da611bc982c1598bd7efe87227b98ee614ef  published/app-release.apk' | sha256sum -c -
          apk=app/build/outputs/apk/release/app-release.apk
          tools=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1 | xargs dirname)
          "$tools/apksigner" verify --verbose "$apk"
          old=$("$tools/apksigner" verify --print-certs published/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          new=$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test -n "$old" && test "$old" = "$new"
          badging=$("$tools/aapt" dump badging "$apk" | head -1)
          [[ "$badging" == *"name='com.doxaiz.netoptimizer'"* && "$badging" == *"versionCode='24'"* && "$badging" == *"versionName='1.0.11'"* ]]
          python3 scripts/check-apk-surface.py "$apk"
          unzip -t "$apk" > /dev/null
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-1.0.11-candidate
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [31, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-1.0.11-candidate
          path: candidate
      - name: Download the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p published
          gh release download v1.0.10 --repo "$GITHUB_REPOSITORY" --pattern app-release.apk --dir published
          echo '90ea233d379164a406d100609103da611bc982c1598bd7efe87227b98ee614ef  published/app-release.apk' | sha256sum -c -
      - name: Download official Shizuku v13.6.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/shizuku-download
          gh release download v13.6.0 --repo RikkaApps/Shizuku --pattern 'shizuku-v13.6.0.r1086.2650830c-release.apk' --dir /tmp/shizuku-download
          mv /tmp/shizuku-download/*.apk /tmp/shizuku.apk
      - name: Build disposable test app
        run: bash scripts/build-manual-app-fixture.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual release upgrade and Data Saver
        uses: reactivecircus/android-emulator-runner@v2
        env:
          AUDIT_DISPOSABLE_EMULATOR: 'yes'
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/run-candidate-checks-once.sh
