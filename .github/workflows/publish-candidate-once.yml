name: Publish verified 1.0.7 (temporary)
on:
  push:
    branches: [arena/a046f27d-net-optimizer-by-doxaiz]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify checks and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 44548000012 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view 44548000012 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = 7a276cc00ec26a885e22a9bece1c5d1a08512343
          git diff --quiet 435a8a85bb886eff4fa3c2394a23fb80d83febb0 7a276cc00ec26a885e22a9bece1c5d1a08512343 -- app build.gradle.kts settings.gradle.kts gradle gradle.properties
          if gh release view v1.0.7 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo '::error::Release v1.0.7 already exists; refusing to replace it.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: release-1.0.7-candidate
          path: candidate
          run-id: 44548000012
          github-token: ${{ github.token }}
      - name: Publish checked APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=candidate/app-release.apk
          test -s "$apk"
          hash=$(sha256sum "$apk" | cut -d ' ' -f1)
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Что нового

          - Без Shizuku теперь можно дополнительно сравнить задержку до и после ручной настройки фоновых данных выбранного приложения.
          - К настройке приложения можно перейти прямо из истории расхода; история не доказывает, что приложение сейчас использует сеть.
          - Системный переключатель меняет пользователь. Ограничение на лимитных сетях может задерживать уведомления и остаётся до отмены.
          - Разница двух замеров не доказывает причину изменения и не гарантирует ускорения; замер может быть недоступен.

          ## Установка

          Android 12+, versionCode 20. Подпись совпадает с 1.0.6. Обновление и ручные действия без Shizuku, а также доступ через Shizuku 13.6.0 проверены на эмуляторах Android 12 и 14. Сохраните важную историю перед установкой. Реальный телефон и улучшение мобильной сети ещё не проверялись.

          По решению владельца используется прежний, скомпрометированный ключ подписи.

          SHA-256: \`$hash\`
          EOF
          gh release create v1.0.7 "$apk" --repo "$GITHUB_REPOSITORY" --target 435a8a85bb886eff4fa3c2394a23fb80d83febb0 --title 'Net Optimizer by Doxaiz 1.0.7' --notes-file "$RUNNER_TEMP/notes.md" --latest
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.7" --jq '.assets[] | select(.name == "app-release.apk") | .digest')
          test "$digest" = "sha256:$hash"
          echo "Published SHA-256: $hash"
