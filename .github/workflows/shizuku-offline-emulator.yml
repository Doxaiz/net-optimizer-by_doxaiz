name: Shizuku offline optimization emulator
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: ./.github/actions/setup-rust-android
      - name: Build development APK
        run: gradle --no-daemon --console plain assembleDebug
      - name: Download Shizuku release for disposable test
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/shizuku.apk" \
            https://github.com/RikkaApps/Shizuku/releases/download/v13.6.0/shizuku-v13.6.0.r1086.2650830c-release.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check confirmed actions and optional comparison offline on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            adb shell wm size 1080x2400
            adb shell wm density 420
            AUDIT_DISPOSABLE_EMULATOR=yes SHIZUKU_OFFLINE_ONLY=yes python3 scripts/check-shizuku-emulator.py app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/shizuku.apk"
