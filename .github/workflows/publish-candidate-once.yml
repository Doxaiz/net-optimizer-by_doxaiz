name: Publish verified 1.0.5 (temporary)
on:
  push:
    branches: [arena/8eed6d1b-net-optimizer-by-doxaiz]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify checks and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 44487522226 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view 44487522226 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = 2b3041ed4bbc11ecafab724b2f912a8fc19633a0
          git diff --quiet ba4b469a6d4e574f188cab6083112c1d828abad5 2b3041ed4bbc11ecafab724b2f912a8fc19633a0 -- app build.gradle.kts settings.gradle.kts gradle gradle.properties
          if gh release view v1.0.5 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo '::error::Release v1.0.5 already exists; refusing to replace it.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: release-1.0.5-candidate
          path: candidate
          run-id: 44487522226
          github-token: ${{ github.token }}
      - name: Publish checked APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=candidate/app-release.apk
          test -s "$apk"
          hash=$(sha256sum "$apk" | cut -d ' ' -f1)
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Что нового

          - Основные действия доступны без Shizuku. Экономия трафика открывается сразу в настройках Android; замер до и после — по желанию.
          - В разделе «Трафик» можно выбрать установленное пользовательское приложение без доступа к статистике и открыть его настройки, чтобы остановить вручную.
          - Настройки Android меняет пользователь. Остановка прерывает работу всего приложения и может задержать уведомления; список не определяет текущую сетевую активность.
          - Экономия трафика может ограничивать фоновые загрузки на лимитных сетях, включая лимитный Wi‑Fi, и действует до отключения. Улучшение не гарантировано.

          ## Установка

          Android 12+, versionCode 18. Подпись совпадает с 1.0.4. Обновление и ручные действия без Shizuku, а также доступ через Shizuku 13.6.0 проверены на эмуляторах Android 12 и 14. Сохраните важную историю перед установкой. Реальный телефон и улучшение мобильной сети ещё не проверялись.

          По решению владельца используется прежний, скомпрометированный ключ подписи.

          SHA-256: \`$hash\`
          EOF
          gh release create v1.0.5 "$apk" --repo "$GITHUB_REPOSITORY" --target ba4b469a6d4e574f188cab6083112c1d828abad5 --title 'Net Optimizer by Doxaiz 1.0.5' --notes-file "$RUNNER_TEMP/notes.md" --latest
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.5" --jq '.assets[] | select(.name == "app-release.apk") | .digest')
          test "$digest" = "sha256:$hash"
          echo "Published SHA-256: $hash"
