name: UI screenshots

on:
  workflow_dispatch:
  push:
    branches: [arena/47e3024f-net-optimizer-by-doxaiz]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: ./.github/actions/setup-rust-android
      - name: Build development APK
        run: gradle --no-daemon --console plain assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture screens on a disposable emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            adb shell wm size 1080x2400
            adb shell wm density 420
            AUDIT_DISPOSABLE_EMULATOR=yes SHOT_DIR=ui-screenshots python3 scripts/capture-ui-screenshots.py app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-screenshots
          if-no-files-found: warn
