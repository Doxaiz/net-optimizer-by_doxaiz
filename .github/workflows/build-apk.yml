name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run unit tests and build debug APK
        run: gradle --no-daemon --console plain testReleaseUnitTest assembleDebug
      - name: Check APK permissions and disabled components
        run: python3 scripts/check-apk-surface.py app/build/outputs/apk/debug/app-debug.apk
      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: NetOptimizer-debug-development-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  signed-release:
    # Release signing requires configured secrets; normal push/PR checks do not.
    if: github.event_name == 'workflow_dispatch'
    needs: debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Signing secrets are missing. Configure the four Android signing secrets before building a release."
            exit 1
          fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/android-signing.jks"
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          gradle --no-daemon --console plain assembleRelease
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: NetOptimizer-by-Doxaiz-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
