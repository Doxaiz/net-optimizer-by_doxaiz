name: Verify release signing configuration

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: ./.github/actions/setup-rust-android
      - name: Build and verify with a disposable test key
        run: |
          set -euo pipefail
          # This key is for configuration tests only. Never publish this APK or key.
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/signing-check.p12"
          export ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          export ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          export ANDROID_KEY_ALIAS="signing-check"
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          keytool -genkeypair -noprompt -keystore "$ANDROID_KEYSTORE_PATH" -storetype PKCS12 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'CN=Disposable signing configuration check'
          gradle --no-daemon --console plain assembleRelease
          python3 scripts/check-native-apk.py app/build/outputs/apk/release/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$apksigner"
          "$apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
